# Zenith — minimal nginx reverse proxy.
# Drop this at /etc/nginx/sites-available/zenith and symlink into sites-enabled.
# Strips the public port 80 down to uvicorn on 127.0.0.1:8000.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Long enough for /api/plan-ai (Claude can take 20-30s on a cold start).
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
